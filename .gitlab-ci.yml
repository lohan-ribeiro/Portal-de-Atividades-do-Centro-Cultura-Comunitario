stages:
  - build
  - test
  - deploy

build-frontend:
  stage: build
  image: node:20
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

build-backend:
  stage: build
  image: node:20
  cache:
    key: backend-$CI_COMMIT_REF_SLUG
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install

test-e2e:
  stage: test
  image: node:20
  variables:
    CYPRESS_BASE_URL: 'http://localhost:5173'
  before_script:
    - apt-get update && apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xauth xvfb
  script:
    - cd frontend
    - npm ci
    - npm run dev &
    - sleep 15
    - ./node_modules/.bin/cypress run --browser electron --headless
  artifacts:
    when: on_failure
    paths:
      - frontend/cypress/screenshots/
      - frontend/cypress/videos/
  only:
    - main

deploy-backend:
  stage: deploy
  image: alpine
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - chmod 600 $SSH_PRIVATE_KEY
    - ssh-add $SSH_PRIVATE_KEY
    - mkdir -p ~/.ssh
    - ssh-keyscan 104.64.43.58 >> ~/.ssh/known_hosts
  script:
    - ssh felipe@104.64.43.58 "cd /projeto && git pull && npm install && pm2 restart backend"
  only:
    - main