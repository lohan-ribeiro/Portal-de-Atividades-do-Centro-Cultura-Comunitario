stages:
  - build
  - test

build-frontend:
  stage: build
  image: node:18
  cache:
    key: frontend-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm install
    - npm run build
  artifacts:
    paths:
      - frontend/dist/

build-backend:
  stage: build
  image: node:18
  cache:
    key: backend-$CI_COMMIT_REF_SLUG
    paths:
      - backend/node_modules/
  script:
    - cd backend
    - npm install
    
test-e2e:
  stage: test
  image: cypress/browsers:node18-chrome105
  variables:
    CYPRESS_BASE_URL: 'http://localhost:5173'
  script:
    - cd frontend
    - npm install
    - npm run dev &
    - sleep 10
    - npx cypress run --browser chrome --headless
  artifacts:
    when: on_failure
    paths:
      - frontend/cypress/screenshots/
      - frontend/cypress/videos/
  only:
    - main